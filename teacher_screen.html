<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>息壤 · 教师实况大屏</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 18px; font-weight: 600; color: var(--accent); letter-spacing: .05em; }
  .era-badge {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text2); }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s ease-in-out infinite;
    display: inline-block;
    margin-right: 4px;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Setup Screen ── */
  #setup-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 40px;
    width: 400px;
    text-align: center;
  }
  .setup-card h2 { font-size: 20px; margin-bottom: 8px; }
  .setup-card p { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .setup-card input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .setup-card input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }

  /* ── Main Layout ── */
  #main-screen { display: none; flex: 1; overflow: hidden; }
  .grid {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    grid-template-rows: 1fr 160px;
    gap: 8px;
    padding: 8px;
    height: 100%;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; overflow-y: auto; }
  .card-body::-webkit-scrollbar { width: 3px; }
  .card-body::-webkit-scrollbar-thumb { background: var(--border); }

  /* ── 学生列表 ── */
  .student-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    margin-bottom: 4px;
    transition: background .15s;
  }
  .student-row:hover { background: var(--surface2); }
  .student-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
  }
  .student-info { flex: 1; min-width: 0; }
  .student-name { font-size: 13px; font-weight: 500; }
  .student-status { font-size: 11px; color: var(--text2); }
  .stuck-badge {
    background: rgba(239,68,68,.15);
    color: var(--red);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .emotion-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text2);
    flex-shrink: 0;
  }

  /* ── 热力图 ── */
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 6px;
  }
  .heat-cell {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid var(--border);
    transition: border-color .3s;
  }
  .heat-cell.high { border-color: var(--green); }
  .heat-cell.mid  { border-color: var(--yellow); }
  .heat-cell.low  { border-color: var(--red); }
  .heat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
  .heat-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; }
  .heat-bar { height: 100%; border-radius: 3px; transition: width .6s ease; }
  .heat-bar.high { background: var(--green); }
  .heat-bar.mid  { background: var(--yellow); }
  .heat-bar.low  { background: var(--red); }
  .heat-pct { font-size: 13px; font-weight: 600; margin-top: 5px; }

  /* ── 情绪分布 ── */
  .emotion-dist { display: flex; flex-direction: column; gap: 8px; }
  .emo-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .emo-name { width: 64px; color: var(--text2); flex-shrink: 0; }
  .emo-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; }
  .emo-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
  .emo-count { width: 24px; text-align: right; font-size: 12px; color: var(--text2); }

  /* ── 干预建议 ── */
  .suggestion-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .sug-icon { font-size: 18px; flex-shrink: 0; }
  .sug-text { color: var(--text2); line-height: 1.5; }
  .sug-target { font-weight: 500; color: var(--text); }

  /* ── 底部状态栏 ── */
  .status-bar {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: 600; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── Alert Toast ── */
  #alert-toast {
    position: fixed;
    top: 60px; right: 20px;
    background: rgba(239,68,68,.9);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    z-index: 100;
    max-width: 280px;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">息壤</div>
    <div class="era-badge" id="era-label">教师实况大屏</div>
  </div>
  <div class="header-right">
    <span id="live-status"><span class="live-dot"></span>实时</span>
    <span id="clock"></span>
    <span id="tick-count" style="color:var(--text3)"></span>
  </div>
</header>

<!-- Setup -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>📡 连接班级大屏</h2>
    <p>输入班级房间ID或班级码，开始实时监控</p>
    <input id="room-input" placeholder="房间ID（如 room_abc123）" />
    <input id="teacher-input" placeholder="教师ID（可选）" />
    <button class="btn-primary" onclick="startDashboard()">开始监控</button>
    <p style="margin-top:12px;font-size:11px;color:var(--text3)">
      提示：在创建班级后，将此大屏URL投影到教室大屏即可
    </p>
  </div>
</div>

<!-- Main Dashboard -->
<div id="main-screen">
  <div class="grid">

    <!-- 左列：学生列表 -->
    <div class="card" style="grid-row: 1">
      <div class="card-title">👥 学生实况</div>
      <div class="card-body" id="student-list">
        <div style="color:var(--text3);font-size:13px;text-align:center;margin-top:20px">等待学生加入…</div>
      </div>
    </div>

    <!-- 中列：概念热力图 -->
    <div class="card" style="grid-row: 1">
      <div class="card-title">🧠 大概念掌握度热力图</div>
      <div class="card-body">
        <div class="heatmap-grid" id="heatmap"></div>
      </div>
    </div>

    <!-- 右列：情绪 + 干预建议 -->
    <div class="card" style="grid-row: 1; display:flex; flex-direction:column; gap:12px;">
      <div>
        <div class="card-title">🎭 全班情绪分布</div>
        <div class="emotion-dist" id="emotion-dist"></div>
      </div>
      <div style="flex:1">
        <div class="card-title" style="margin-top:8px">💡 干预建议</div>
        <div id="suggestions-list"></div>
      </div>
    </div>

    <!-- 底部状态条 -->
    <div class="status-bar">
      <div class="stat-card">
        <div class="stat-num" id="stat-members">0</div>
        <div class="stat-label">在线学生</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-rounds" style="color:var(--accent)">0</div>
        <div class="stat-label">平均探究轮次</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-concepts" style="color:var(--accent2)">0</div>
        <div class="stat-label">触碰大概念数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-stuck" style="color:var(--red)">0</div>
        <div class="stat-label">卡住学生</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-citations" style="color:var(--green)">0</div>
        <div class="stat-label">总史料引用</div>
      </div>
    </div>

  </div>
</div>

<div id="alert-toast"></div>

<script>
let evtSource = null;
let roomId = '';

function startDashboard() {
  roomId = document.getElementById('room-input').value.trim();
  const teacherId = document.getElementById('teacher-input').value.trim();
  if (!roomId) { alert('请输入班级房间ID'); return; }

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';

  const url = `/api/dashboard/${roomId}/stream?teacher_id=${encodeURIComponent(teacherId)}&interval=3`;
  evtSource = new EventSource(url);

  evtSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'dashboard_tick') renderTick(data);
      else if (data.type === 'error') showAlert(data.detail);
    } catch(err) { console.error(err); }
  };

  evtSource.onerror = () => {
    document.getElementById('live-status').innerHTML = '<span style="color:var(--red)">● 断线，重连中…</span>';
    setTimeout(() => startDashboard(), 5000);
  };
}

function renderTick(data) {
  document.getElementById('tick-count').textContent = `#${data.tick}`;
  const ov = data.overview || {};

  // 统计条
  document.getElementById('stat-members').textContent = data.member_count || 0;
  const members = ov.members || [];
  const avgRounds = members.length
    ? Math.round(members.reduce((s,m)=>s+m.rounds,0)/members.length)
    : 0;
  document.getElementById('stat-rounds').textContent = avgRounds;
  document.getElementById('stat-stuck').textContent = members.filter(m=>m.is_stuck).length;
  document.getElementById('stat-citations').textContent =
    members.reduce((s,m)=>s+(m.citations||0),0);

  // 大概念热力图
  const conceptMap = {};
  members.forEach(m => (m.concepts||[]).forEach(c => {
    conceptMap[c] = (conceptMap[c]||0) + 1;
  }));
  document.getElementById('stat-concepts').textContent = Object.keys(conceptMap).length;
  renderHeatmap(conceptMap, members.length);

  // 学生列表
  renderStudentList(members);

  // 情绪分布
  const emotionMap = {};
  members.forEach(m => {
    if (m.emotion && m.emotion !== '—') emotionMap[m.emotion] = (emotionMap[m.emotion]||0)+1;
  });
  renderEmotions(emotionMap, members.length);

  // 干预建议
  renderSuggestions(data.suggestions || []);

  // 大屏标题
  if (data.overview?.era) document.getElementById('era-label').textContent = data.overview.era;
}

function renderHeatmap(conceptMap, total) {
  const concepts = [
    '因果关系','历史变迁','历史证据','历史解释',
    '历史意义','历史视角','帝制崩溃','权力分配',
    '民本思想','改革困境'
  ];
  const el = document.getElementById('heatmap');
  el.innerHTML = '';
  const allConcepts = [...new Set([...concepts, ...Object.keys(conceptMap)])];

  allConcepts.slice(0, 12).forEach(c => {
    const count = conceptMap[c] || 0;
    const pct = total > 0 ? Math.round(count/total*100) : 0;
    const cls = pct >= 60 ? 'high' : pct >= 30 ? 'mid' : 'low';
    el.innerHTML += `
      <div class="heat-cell ${cls}">
        <div class="heat-label">${c}</div>
        <div class="heat-bar-wrap"><div class="heat-bar ${cls}" style="width:${pct}%"></div></div>
        <div class="heat-pct">${pct}%</div>
      </div>`;
  });
  if (allConcepts.length === 0) {
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;margin-top:20px">等待学生开始探究…</div>';
  }
}

function renderStudentList(members) {
  const el = document.getElementById('student-list');
  if (!members.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;margin-top:20px">等待学生加入…</div>';
    return;
  }
  el.innerHTML = members.map(m => `
    <div class="student-row">
      <div class="student-avatar">${(m.name||m.user_id||'?')[0]}</div>
      <div class="student-info">
        <div class="student-name">${m.name||m.user_id}</div>
        <div class="student-status">${m.rounds||0}轮 · ${m.top_concept||'探索中'}</div>
      </div>
      ${m.emotion && m.emotion!=='—' ? `<span class="emotion-tag">${m.emotion}</span>` : ''}
      ${m.is_stuck ? `<span class="stuck-badge">卡住</span>` : ''}
    </div>`).join('');
}

const EMOTION_COLORS = {
  '好奇': '#3b82f6', '兴奋': '#8b5cf6', '困惑': '#f59e0b',
  '沮丧': '#ef4444', '满足': '#10b981', '冷静': '#6b7280',
};
function renderEmotions(emotionMap, total) {
  const el = document.getElementById('emotion-dist');
  const sorted = Object.entries(emotionMap).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无情绪数据</div>';
    return;
  }
  const max = sorted[0][1];
  el.innerHTML = sorted.slice(0,6).map(([emo, cnt]) => {
    const color = EMOTION_COLORS[emo] || '#64748b';
    return `
      <div class="emo-row">
        <span class="emo-name">${emo}</span>
        <div class="emo-track"><div class="emo-fill" style="width:${Math.round(cnt/max*100)}%;background:${color}"></div></div>
        <span class="emo-count">${cnt}</span>
      </div>`;
  }).join('');
}

function renderSuggestions(suggestions) {
  const el = document.getElementById('suggestions-list');
  const ICONS = { alert:'⚠️', nudge:'💬', praise:'🌟', default:'💡' };
  if (!suggestions.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无干预建议</div>';
    return;
  }
  el.innerHTML = suggestions.map(s => `
    <div class="suggestion-item">
      <div class="sug-icon">${ICONS[s.type]||ICONS.default}</div>
      <div class="sug-text">
        <span class="sug-target">${s.target||''}</span>${s.target?' · ':''}${s.message||s.action||''}
      </div>
    </div>`).join('');
}

function showAlert(msg) {
  const el = document.getElementById('alert-toast');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

// 时钟
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// URL 参数自动连接
const params = new URLSearchParams(location.search);
if (params.get('room')) {
  document.getElementById('room-input').value = params.get('room');
  if (params.get('teacher')) document.getElementById('teacher-input').value = params.get('teacher');
  startDashboard();
}
</script>
</body>
</html>
