# deploy/docker-compose.yml
# 息壤完整生产栈
# 服务：xirang-app + Redis + PostgreSQL + Prometheus + Grafana + Nginx

version: "3.9"

services:

  # ── 应用服务 ─────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: xirang-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      XIRANG_ENV:             prod
      XIRANG_API_KEY:         ${XIRANG_API_KEY}
      XIRANG_BASE_URL:        ${XIRANG_BASE_URL:-https://api.openai.com/v1}
      XIRANG_MODEL:           ${XIRANG_MODEL:-gpt-4o-mini}
      XIRANG_REDIS_URL:       redis://redis:6379/0
      XIRANG_USE_REDIS:       "true"
      XIRANG_DB_URL:          postgresql://xirang:${POSTGRES_PASSWORD:-xirang}@postgres:5432/xirang
      XIRANG_USE_POSTGRES:    "true"
      XIRANG_JWT_SECRET:      ${XIRANG_JWT_SECRET}
      XIRANG_AUTH_ENABLED:    ${XIRANG_AUTH_ENABLED:-false}
      XIRANG_RATE_LIMIT:      ${XIRANG_RATE_LIMIT:-true}
      XIRANG_RATE_LIMIT_RPM:  ${XIRANG_RATE_LIMIT_RPM:-60}
      XIRANG_METRICS:         "true"
      XIRANG_LOG_JSON:        "true"
      XIRANG_LOG_LEVEL:       INFO
      XIRANG_WORKERS:         ${XIRANG_WORKERS:-2}
      XIRANG_DATA_DIR:        /data
    volumes:
      - xirang-data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - xirang-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

  # ── Redis（会话 & 限流）────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: xirang-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xirang-net
    deploy:
      resources:
        limits:
          memory: 600M

  # ── PostgreSQL（用户档案持久化）──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: xirang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       xirang
      POSTGRES_USER:     xirang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xirang}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../deploy/sql/init_full.sql:/docker-entrypoint-initdb.d/init_full.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xirang -d xirang"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xirang-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Prometheus（指标采集）────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: xirang-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - xirang-net

  # ── Grafana（可视化监控）─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: xirang-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - xirang-net

  # ── Nginx（反向代理 + SSL 终结）─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: xirang-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录：开发时挂载 ./certs/，生产时 certbot 写入后自动生效
      - ../deploy/certs:/etc/nginx/certs:ro
      # Let's Encrypt ACME 验证目录（certbot webroot 模式）
      - ../deploy/certbot-webroot:/var/www/certbot:ro
      # Let's Encrypt 证书存储
      - ../deploy/certs/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - xirang-net

volumes:
  xirang-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  xirang-net:
    driver: bridge
