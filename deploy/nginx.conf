# deploy/nginx.conf
# Nginx 反向代理配置（P0 完整版）
# ─────────────────────────────────────────────────────────────────
# 说明：
#   - 开发模式：HTTP only（无证书时自动回退，用 ./start.sh dev）
#   - 生产模式：HTTP→HTTPS 重定向 + TLS 1.2/1.3
#   - SSE 流式端点已单独配置，禁用 buffering
# ─────────────────────────────────────────────────────────────────

upstream xirang_app {
    server app:8000;
    keepalive 32;
}

# ── HTTP：开发模式直接代理 / 生产模式重定向 HTTPS ────────────────
server {
    listen 80;
    server_name _;

    # 健康检查端点（负载均衡器探针）
    location = /health {
        proxy_pass http://xirang_app/health;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Let's Encrypt ACME 验证（certbot webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 其余流量：有证书则跳 HTTPS，无证书则直接代理（开发模式）
    location / {
        # 有证书文件存在时重定向 HTTPS，否则直接代理
        set $do_redirect 0;
        if (-f /etc/nginx/certs/fullchain.pem) {
            set $do_redirect 1;
        }
        if ($do_redirect = 1) {
            return 301 https://$host$request_uri;
        }
        # 开发模式：无证书时直接反代
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

# ── HTTPS：生产模式 ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书
    # 开发：./deploy/start.sh ssl  → deploy/certs/
    # 生产：certbot → /etc/letsencrypt/live/<domain>/
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 安全配置
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling（减少 TLS 握手延迟）
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 上传限制（史料文件）
    client_max_body_size 50M;

    # ── SSE 流式端点（AI 对话关键：禁用所有缓冲）────────────────
    location ~ ^/api/(stream_next|classroom/stream)/ {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        proxy_connect_timeout      10s;
        chunked_transfer_encoding  on;

        # SSE Content-Type 透传
        proxy_set_header   Accept text/event-stream;
    }

    # ── 文件上传端点 ─────────────────────────────────────────────
    location /api/ingest/upload {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── 支付回调（来自微信/支付宝服务器，不做 rate limit）───────
    location ~ ^/api/payment/notify/ {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── 普通 API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── 静态文件 & SPA fallback ──────────────────────────────────
    location / {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_valid  200 10m;
        proxy_cache_valid  404 1m;
    }

    # ── Prometheus 监控（仅内网）────────────────────────────────
    location /metrics {
        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.1;
        deny   all;
        proxy_pass http://xirang_app/metrics;
        access_log off;
    }

    # ── 健康检查 ─────────────────────────────────────────────────
    location = /health {
        proxy_pass http://xirang_app/health;
        proxy_read_timeout 5s;
        access_log off;
    }
}
