# deploy/nginx.conf
# Nginx 反向代理配置
# 关键：SSE 需要禁用 buffering，否则流式响应会卡住

upstream xirang_app {
    server app:8000;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书（生产替换为真实证书路径）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 安全 Header
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50M;   # 史料上传限制

    # ── SSE 流式端点（禁用 buffering）──────────────────────
    location ~ ^/api/(stream_next|classroom/stream)/ {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # 禁用所有缓冲（SSE 关键）
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;   # SSE 长连接
        proxy_send_timeout    3600s;
        chunked_transfer_encoding on;
    }

    # ── 文件上传端点 ───────────────────────────────────────
    location /api/ingest/upload {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── 普通 API ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
    }

    # ── 静态文件 & SPA ─────────────────────────────────────
    location / {
        proxy_pass         http://xirang_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 10m;
    }

    # ── 监控端点（内网访问）───────────────────────────────
    location /metrics {
        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        deny   all;
        proxy_pass http://xirang_app/metrics;
    }
}
