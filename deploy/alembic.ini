# deploy/alembic.ini
# Alembic 数据库迁移配置
# 用法：
#   cd deploy && alembic upgrade head     # 升级到最新
#   alembic revision --autogenerate -m "描述"  # 生成迁移文件
#   alembic downgrade -1                  # 回滚一步

[alembic]
script_location = migrations
prepend_sys_path = ..
version_path_separator = os

# 从环境变量读取数据库连接串
sqlalchemy.url = postgresql://xirang:xirang@localhost:5432/xirang

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
