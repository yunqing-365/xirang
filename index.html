<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="data:;base64,=">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>息壤 | 生成式人文时空底座</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ══ 世界情绪 FSM CSS 变量 ══════════════════════════════ */
        :root {
            --bg-paper: #FDF6E3;
            --text-ink: #2C3E50;
            --accent-red: #8B1D1D;
            --border-gold: #D4C4A8;
            --mood-overlay: rgba(253,246,227,0);
            --mood-vignette: rgba(0,0,0,0.04);
            --mood-accent: #8B1D1D;
            --mood-border: #D4C4A8;
            --mood-glow: rgba(139,29,29,0.05);
            --mood-filter: none;
        }
        body[data-mood="SERENE"]    { --mood-overlay:rgba(240,248,240,0.18); --mood-vignette:rgba(34,100,34,0.04); --mood-accent:#2a6e3f; --mood-border:#b5d5c0; --mood-glow:rgba(42,110,63,0.07); }
        body[data-mood="MELANCHOLY"]{ --mood-overlay:rgba(180,190,210,0.18); --mood-vignette:rgba(60,60,100,0.08); --mood-accent:#4a5580; --mood-border:#9ca8c8; --mood-glow:rgba(74,85,128,0.1); --mood-filter:saturate(0.7) brightness(0.95); }
        body[data-mood="TENSE"]     { --mood-overlay:rgba(210,60,30,0.07); --mood-vignette:rgba(160,20,0,0.12); --mood-accent:#961a0a; --mood-border:#e0876a; --mood-glow:rgba(150,26,10,0.12); --mood-filter:saturate(1.1) contrast(1.03); }
        body[data-mood="JOYFUL"]    { --mood-overlay:rgba(255,240,180,0.2); --mood-vignette:rgba(180,140,0,0.05); --mood-accent:#8a6200; --mood-border:#e0c060; --mood-glow:rgba(200,160,0,0.1); --mood-filter:saturate(1.15) brightness(1.03); }
        body[data-mood="SOLEMN"]    { --mood-overlay:rgba(80,60,40,0.1); --mood-vignette:rgba(40,30,10,0.1); --mood-accent:#4a3820; --mood-border:#a09070; --mood-glow:rgba(60,45,20,0.1); --mood-filter:saturate(0.85) sepia(0.1); }
        body[data-mood="CHAOTIC"]   { --mood-overlay:rgba(120,40,140,0.07); --mood-vignette:rgba(100,0,80,0.1); --mood-accent:#6b1060; --mood-border:#c070b0; --mood-glow:rgba(100,10,90,0.1); --mood-filter:saturate(1.2) contrast(1.05); }

        body {
            background-color: var(--bg-paper);
            color: var(--text-ink);
            font-family: 'Noto Serif SC', serif;
            margin: 0; padding: 0;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
            transition: filter 1.6s ease, background-color 1.6s ease;
            filter: var(--mood-filter, none);
        }
        body::before {
            content:""; position:fixed; inset:0; pointer-events:none;
            background: var(--mood-overlay); transition: background 1.6s ease; z-index:0;
        }
        body::after {
            content:""; position:fixed; inset:0; pointer-events:none;
            background: radial-gradient(ellipse at center, transparent 60%, var(--mood-vignette) 100%);
            transition: background 1.6s ease; z-index:0;
        }

        /* ══ Mood 状态栏 ══════════════════════════════════════ */
        #mood-bar {
            position:fixed; top:0; left:0; right:0; z-index:200;
            display:flex; justify-content:center; align-items:center; gap:8px;
            padding:6px 20px;
            background:rgba(253,246,227,0.85); border-bottom:1px solid var(--mood-border);
            backdrop-filter:blur(8px); font-size:0.8em; color:var(--mood-accent);
            letter-spacing:2px; transition:all 1.2s ease; opacity:0;
        }
        #mood-bar.visible { opacity:1; }
        #mood-dot {
            width:7px; height:7px; border-radius:50%;
            background:var(--mood-accent); box-shadow:0 0 6px var(--mood-glow);
            animation: mood-pulse 2.5s ease-in-out infinite;
        }
        @keyframes mood-pulse { 0%,100%{transform:scale(1);opacity:0.7;} 50%{transform:scale(1.4);opacity:1;} }

        #mood-flash {
            position:fixed; inset:0; pointer-events:none; z-index:199;
            opacity:0; background:var(--mood-overlay); transition:opacity 0.3s ease;
        }
        #mood-flash.active { opacity:0.35; }

        /* ══ 主布局 ══════════════════════════════════════════ */
        .header {
            text-align:center; padding:56px 0 20px;
            border-bottom:2px solid var(--accent-red);
            width:80%; margin:0 auto 30px; position:relative; z-index:1;
        }
        .header h1 { font-size:2.5em; color:var(--accent-red); margin:0; letter-spacing:5px; font-weight:700; }
        .header p { color:#7F8C8D; letter-spacing:2px; font-size:0.9em; }

        .creation-panel {
            width:80%; margin:0 auto 30px; text-align:center; padding:30px 20px;
            background:rgba(255,255,255,0.5); border:1px dashed var(--border-gold);
            border-radius:8px; position:relative; z-index:1;
        }
        .creation-panel h3 { color:var(--accent-red); margin-top:0; }
        .creation-panel input, .creation-panel select {
            padding:10px 15px; font-size:1.05em; border:1px solid var(--border-gold);
            border-radius:4px; margin-right:10px; font-family:'Noto Serif SC',serif;
            color:var(--text-ink); background:rgba(255,255,255,0.8);
        }

        .container {
            display:flex; width:90%; max-width:1400px; margin:0 auto; gap:30px;
            position:relative; z-index:1;
        }

        .deduction-stream {
            flex:2; display:flex; flex-direction:column; gap:20px; padding-bottom:180px;
        }

        /* ══ 右侧面板系统 ══════════════════════════════════════ */
        .side-panel-stack {
            flex:0 0 300px; display:flex; flex-direction:column; gap:16px;
            position:sticky; top:44px; height:fit-content;
        }

        .side-panel {
            background:#FAFAFA; padding:20px 22px;
            border:1px solid var(--border-gold);
            box-shadow:3px 3px 0 rgba(139,29,29,0.06);
            border-radius:4px;
        }
        .side-panel-title {
            font-size:0.78em; letter-spacing:3px; color:var(--accent-red);
            border-bottom:1px solid var(--border-gold);
            padding-bottom:10px; margin-bottom:14px; text-align:center;
        }

        /* ── 产物面板 ── */
        .workspace-content { line-height:2; color:var(--text-ink); white-space:pre-wrap; font-size:0.98em; }

        /* ── 人格一致性面板 ── */
        #consistency-panel { border-left:3px solid var(--mood-accent, var(--accent-red)); }
        .consistency-ring-wrap { display:flex; justify-content:center; margin:8px 0 12px; }
        .consistency-ring {
            position:relative; width:80px; height:80px;
        }
        .consistency-ring svg { transform:rotate(-90deg); }
        .ring-track { fill:none; stroke:#e8e0d0; stroke-width:6; }
        .ring-fill {
            fill:none; stroke:var(--mood-accent, var(--accent-red)); stroke-width:6;
            stroke-linecap:round;
            stroke-dasharray:213; stroke-dashoffset:213;
            transition: stroke-dashoffset 1s ease, stroke 1s ease;
        }
        .ring-label {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            font-size:1.4em; font-weight:700; color:var(--mood-accent, var(--accent-red));
        }
        .ring-sublabel { font-size:0.48em; color:#888; font-weight:400; letter-spacing:1px; }
        .consistency-desc { font-size:0.82em; color:#777; text-align:center; line-height:1.6; }

        /* ── 叙事阶段面板 ── */
        .arc-phases { display:flex; justify-content:space-between; margin-bottom:10px; position:relative; }
        .arc-phases::before {
            content:""; position:absolute; top:14px; left:16px; right:16px; height:2px;
            background:linear-gradient(90deg, var(--mood-accent,var(--accent-red)) var(--arc-pct,0%), #ddd var(--arc-pct,0%));
            transition: background 0.8s ease;
        }
        .arc-dot-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; z-index:1; }
        .arc-dot {
            width:12px; height:12px; border-radius:50%;
            background:#ddd; border:2px solid #ccc;
            transition: all 0.5s ease;
        }
        .arc-dot.active {
            background:var(--mood-accent,var(--accent-red));
            border-color:var(--mood-accent,var(--accent-red));
            box-shadow:0 0 8px var(--mood-glow);
        }
        .arc-dot.done { background:var(--mood-border,#D4C4A8); border-color:var(--mood-border,#D4C4A8); }
        .arc-label { font-size:0.68em; color:#999; letter-spacing:0.5px; }
        .arc-label.active { color:var(--mood-accent,var(--accent-red)); font-weight:600; }
        .arc-phase-desc { font-size:0.8em; color:#888; text-align:center; font-style:italic; line-height:1.5; }

        /* ── 探索成长面板 ── */
        .title-badge {
            display:inline-block; background:var(--mood-glow,rgba(139,29,29,0.06));
            border:1px solid var(--mood-border,var(--border-gold));
            color:var(--mood-accent,var(--accent-red));
            padding:4px 14px; border-radius:20px;
            font-size:0.9em; letter-spacing:2px; margin-bottom:12px;
        }
        .profile-stat { font-size:0.8em; color:#777; margin-bottom:4px; }
        .era-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
        .era-tag {
            background:rgba(212,196,168,0.3); border:1px solid var(--border-gold);
            border-radius:10px; padding:2px 10px; font-size:0.72em; color:#7a6040;
        }
        .profile-hint {
            font-size:0.75em; color:#a09070; margin-top:10px; font-style:italic;
            border-top:1px dashed var(--border-gold); padding-top:8px;
        }

        /* ══ 对话流卡片 ══════════════════════════════════════ */
        .chat-card {
            background:#FFFFFF; border:1px solid var(--border-gold);
            padding:25px 30px; position:relative;
            box-shadow:2px 4px 15px rgba(0,0,0,0.02);
            opacity:0; transform:translateY(20px); animation:fadeIn 0.6s forwards;
            border-radius:4px;
        }
        .chat-card::before {
            content:""; position:absolute; top:15px; bottom:15px; left:15px;
            width:2px; background-color:var(--accent-red); opacity:0.6;
        }
        .narrator-card { background:transparent; border:none; box-shadow:none; text-align:center; padding:15px; color:#555; font-style:italic; }
        .narrator-card::before { display:none; }
        .narrator-card span { background:rgba(212,196,168,0.3); padding:5px 15px; border-radius:20px; font-size:0.95em; border:1px dashed var(--border-gold); }
        .echo-card { background:linear-gradient(135deg,#f9f4e8,#f0e8d0); border:1px solid #c8a84a; border-left:3px solid #c8a84a; color:#5a3e1b; font-style:italic; text-align:center; padding:18px 24px; }
        .echo-card::before { background-color:#c8a84a; opacity:0.8; }
        .echo-label { font-size:0.78em; letter-spacing:3px; color:#a07830; margin-bottom:8px; }
        .echo-text { font-size:1.0em; line-height:1.9; }
        .choices-card { background:#FEFCF8; border:1px solid var(--mood-border,var(--border-gold)); border-top:3px solid var(--mood-accent,var(--accent-red)); padding:20px 28px; }
        .choices-card::before { background-color:var(--mood-accent,var(--accent-red)); }
        .choices-title { font-size:0.82em; letter-spacing:2px; color:var(--mood-accent,var(--accent-red)); margin-bottom:14px; }
        .choice-btn { display:block; width:100%; text-align:left; background:rgba(255,255,255,0.7); border:1px solid var(--mood-border,var(--border-gold)); border-radius:4px; padding:10px 16px; margin-bottom:8px; font-family:'Noto Serif SC',serif; font-size:0.96em; color:var(--text-ink); cursor:pointer; transition:all 0.25s; line-height:1.6; }
        .choice-btn:hover { background:var(--mood-glow,rgba(139,29,29,0.05)); border-color:var(--mood-accent,var(--accent-red)); transform:translateX(3px); }
        .choice-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
        .choice-btn.selected { background:var(--mood-glow,rgba(139,29,29,0.08)); border-color:var(--mood-accent,var(--accent-red)); color:var(--mood-accent,var(--accent-red)); font-weight:600; }
        .agent-name { font-size:1.2em; font-weight:700; color:var(--accent-red); margin-bottom:8px; margin-left:10px; }
        .agent-action { font-size:0.9em; color:#888; font-style:italic; margin-bottom:12px; margin-left:10px; }
        .agent-dialogue { font-size:1.05em; line-height:1.8; margin-left:10px; text-align:justify; }
        .agent-contribution { margin-top:15px; margin-left:10px; padding-top:10px; border-top:1px dashed var(--border-gold); color:#9A7B4F; font-size:0.9em; }
        .thinking-indicator { margin-left:10px; color:#7F8C8D; font-style:italic; animation:pulse 1.5s infinite; }
        .typing-cursor { display:inline-block; width:8px; height:1.2em; background-color:var(--accent-red); vertical-align:middle; margin-left:4px; animation:blink 1s step-end infinite; }

        /* ══ 情境知识气泡 ════════════════════════════════════ */
        .knows-term {
            border-bottom: 1px dotted var(--mood-accent, var(--accent-red));
            cursor: help;
            position: relative;
        }
        #knowledge-bubble {
            position: fixed;
            z-index: 400;
            max-width: 260px;
            background: linear-gradient(150deg, #fffbf0, #f5ead6);
            border: 1px solid #c8a84a;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.82em;
            line-height: 1.7;
            color: #4a3010;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #knowledge-bubble.visible { opacity: 1; }
        #knowledge-bubble .bubble-term { font-weight:700; color:var(--mood-accent,var(--accent-red)); margin-bottom:4px; }
        #knowledge-bubble .bubble-loader { font-style:italic; color:#aaa; }

        /* ══ 反思弹层 ════════════════════════════════════════ */
        #reflection-overlay {
            position:fixed; inset:0; z-index:500;
            display:flex; align-items:center; justify-content:center;
            background:rgba(20,12,5,0.62); backdrop-filter:blur(3px);
            opacity:0; pointer-events:none; transition:opacity 0.4s ease;
        }
        #reflection-overlay.open { opacity:1; pointer-events:all; }
        .reflection-card {
            background:linear-gradient(160deg,#fdf8ef,#f5ead6); border:1px solid #c8a84a;
            border-radius:6px; max-width:540px; width:90%; padding:40px 44px;
            position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.8);
            transform:translateY(20px) scale(0.97);
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        #reflection-overlay.open .reflection-card { transform:translateY(0) scale(1); }
        .reflection-deco { text-align:center; font-size:1.4em; margin-bottom:6px; opacity:0.7; }
        .reflection-eyebrow { text-align:center; font-size:0.72em; letter-spacing:4px; color:#a07830; margin-bottom:22px; }
        .reflection-insight { font-size:1.08em; line-height:1.9; color:#3a2800; margin-bottom:22px; text-align:justify; }
        .reflection-question { background:rgba(200,168,74,0.12); border-left:3px solid #c8a84a; padding:12px 16px; font-size:0.96em; color:#6a4800; font-style:italic; line-height:1.7; margin-bottom:18px; border-radius:0 4px 4px 0; }
        .reflection-era-fact { font-size:0.82em; color:#8a7050; border-top:1px dashed #c8a84a; padding-top:14px; line-height:1.6; }
        .reflection-close { display:block; margin:22px auto 0; background:transparent; border:1px solid #c8a84a; color:#8a6200; padding:8px 28px; font-family:'Noto Serif SC',serif; font-size:0.9em; letter-spacing:2px; cursor:pointer; border-radius:3px; transition:all 0.2s; }
        .reflection-close:hover { background:rgba(200,168,74,0.15); border-color:#a07830; }

        /* ══ 底部控制栏 ══════════════════════════════════════ */
        .controls {
            position:fixed; bottom:0; left:0; width:100%;
            background:rgba(253,246,227,0.95); border-top:1px solid var(--border-gold);
            padding:15px 0; display:flex; flex-direction:column; align-items:center; gap:10px;
            backdrop-filter:blur(5px); z-index:100; box-shadow:0 -5px 20px rgba(0,0,0,0.05);
        }
        .mode-switch { display:flex; gap:15px; margin-bottom:5px; width:50%; max-width:600px; justify-content:center; }
        .mode-switch button { background-color:transparent; color:#7F8C8D; border:1px solid var(--border-gold); padding:6px 20px; border-radius:20px; font-size:0.9em; cursor:pointer; transition:all 0.3s; }
        .mode-switch button.active { background-color:var(--accent-red); color:#FDF6E3; border-color:var(--accent-red); box-shadow:0 2px 8px rgba(139,29,29,0.2); }
        .intervention-box { display:flex; gap:10px; width:50%; max-width:600px; }
        .intervention-box input { flex:1; padding:10px 15px; border:1px solid var(--border-gold); border-radius:4px; background:rgba(255,255,255,0.8); font-family:'Noto Serif SC',serif; color:var(--text-ink); outline:none; }
        .intervention-box input:focus { border-color:var(--accent-red); }
        .intervention-box button { background-color:transparent; border:1px solid var(--accent-red); color:var(--accent-red); padding:8px 15px; cursor:pointer; font-family:'Noto Serif SC',serif; }
        .intervention-box button:hover { background-color:rgba(139,29,29,0.1); }
        .advance-btn { background-color:var(--accent-red); color:#FDF6E3; border:none; padding:10px 30px; font-size:1.05em; font-family:'Noto Serif SC',serif; cursor:pointer; transition:all 0.3s; letter-spacing:2px; border-radius:4px; }
        .advance-btn:hover { background-color:#6A1515; box-shadow:0 4px 10px rgba(139,29,29,0.3); }
        .advance-btn:disabled { background-color:#999; cursor:not-allowed; box-shadow:none; }
        .btn-resume { background-color:#2C3E50; }
        .btn-resume:hover { background-color:#1a252f; }

        @keyframes fadeIn { to { opacity:1; transform:translateY(0); } }
        @keyframes pulse { 0%{opacity:0.5;} 50%{opacity:1;} 100%{opacity:0.5;} }
        @keyframes blink { 50%{opacity:0;} }
        .hidden { display:none !important; }
    </style>
</head>
<body>

    <div id="mood-bar">
        <span id="mood-dot"></span>
        <span id="mood-label">世界情绪：平静</span>
        <span id="mood-motif" style="opacity:0.6;font-size:0.9em;"></span>
    </div>
    <div id="mood-flash"></div>

    <!-- 情境知识气泡 -->
    <div id="knowledge-bubble">
        <div class="bubble-term" id="bubble-term"></div>
        <div id="bubble-body"></div>
    </div>

    <!-- 反思弹层 -->
    <div id="reflection-overlay">
        <div class="reflection-card">
            <div class="reflection-deco">☯</div>
            <div class="reflection-eyebrow">人 文 回 响</div>
            <div class="reflection-insight" id="r-insight"></div>
            <div class="reflection-question" id="r-question"></div>
            <div class="reflection-era-fact" id="r-era-fact"></div>
            <button class="reflection-close" onclick="closeReflection()">沉思片刻，继续</button>
        </div>
    </div>

    <div class="header">
        <h1>息 壤</h1>
        <p>生成式人文时空计算底座 · 浩瀚绿洲</p>
    </div>

    <div class="creation-panel" id="creationPanel">
        <h3>🌌 开辟新时空</h3>
        <p style="color:#777;font-size:0.9em;margin-bottom:20px;">输入主题与风格，大模型将为您动态生成世界观、环境与NPC网络。</p>
        <div style="margin-bottom:25px;">
            <input type="text" id="worldThemeInput" placeholder="主题，如：明朝万历年间，江南茶馆..." style="width:40%;">
            <select id="worldGenreInput">
                <option value="历史客观写实">📜 历史客观写实</option>
                <option value="宫廷权谋/政治">🗡️ 宫廷权谋/政治</option>
                <option value="市井烟火">🏮 市井烟火</option>
                <option value="凄美宿命/红楼梦">🌸 凄美宿命/红楼梦</option>
            </select>
            <button class="advance-btn" id="createWorldBtn" onclick="createNewWorld()">创世</button>
        </div>
        <hr style="border:none;border-top:1px dashed var(--border-gold);margin:25px auto;width:60%;">
        <h3>🔄 唤醒旧日时空</h3>
        <p style="color:#777;font-size:0.9em;margin-bottom:20px;">输入之前离开时的 Session ID，无缝读取世界进度、物理环境与NPC记忆。</p>
        <div>
            <input type="text" id="resumeSessionId" placeholder="输入已存在的 Session ID (如 session_123abc)..." style="width:50%;">
            <button class="advance-btn btn-resume" id="resumeWorldBtn" onclick="resumeWorld()">唤醒</button>
        </div>
        <div id="creationStatus" style="margin-top:20px;color:var(--accent-red);font-weight:bold;font-style:italic;"></div>
    </div>

    <div class="container hidden" id="mainContainer">
        <div class="deduction-stream" id="chat-stream"></div>

        <!-- 右侧三层面板 -->
        <div class="side-panel-stack">

            <!-- 1. 叙事弧线面板 -->
            <div class="side-panel" id="arc-panel">
                <div class="side-panel-title">叙 事 弧 线</div>
                <div class="arc-phases" id="arc-phases" style="--arc-pct:0%">
                    <div class="arc-dot-wrap">
                        <div class="arc-dot" id="arc-OPENING" data-phase="OPENING"></div>
                        <div class="arc-label" id="arc-lbl-OPENING">序幕</div>
                    </div>
                    <div class="arc-dot-wrap">
                        <div class="arc-dot" id="arc-RISING" data-phase="RISING"></div>
                        <div class="arc-label" id="arc-lbl-RISING">铺垫</div>
                    </div>
                    <div class="arc-dot-wrap">
                        <div class="arc-dot" id="arc-CLIMAX" data-phase="CLIMAX"></div>
                        <div class="arc-label" id="arc-lbl-CLIMAX">高潮</div>
                    </div>
                    <div class="arc-dot-wrap">
                        <div class="arc-dot" id="arc-DENOUEMENT" data-phase="DENOUEMENT"></div>
                        <div class="arc-label" id="arc-lbl-DENOUEMENT">收束</div>
                    </div>
                </div>
                <div class="arc-phase-desc" id="arc-desc">等待时空开启...</div>
            </div>

            <!-- 2. 人格一致性面板 -->
            <div class="side-panel" id="consistency-panel">
                <div class="side-panel-title">人 格 一 致 性</div>
                <div class="consistency-ring-wrap">
                    <div class="consistency-ring">
                        <svg viewBox="0 0 72 72" width="80" height="80">
                            <circle class="ring-track" cx="36" cy="36" r="34"/>
                            <circle class="ring-fill" id="ring-fill" cx="36" cy="36" r="34"/>
                        </svg>
                        <div class="ring-label">
                            <span id="score-num">—</span>
                            <span class="ring-sublabel" id="score-lbl">待机中</span>
                        </div>
                    </div>
                </div>
                <div class="consistency-desc" id="consistency-desc">角色人格与历史原型的契合程度</div>
            </div>

            <!-- 3. 探索成长面板 -->
            <div class="side-panel" id="profile-panel">
                <div class="side-panel-title">探 索 档 案</div>
                <div style="text-align:center;">
                    <div class="title-badge" id="profile-title">初入时空</div>
                </div>
                <div class="profile-stat">⏳ 累计 <span id="p-sessions">0</span> 次会话 · <span id="p-rounds">0</span> 回合</div>
                <div class="profile-stat">📜 已历朝代：</div>
                <div class="era-tags" id="p-eras"><span style="color:#bbb;font-size:0.8em;">尚未探索</span></div>
                <div class="profile-hint" id="p-hint"></div>
            </div>

            <!-- 4. 时空焦点产物 -->
            <div class="side-panel">
                <div class="side-panel-title" id="workspaceTitle">时 空 焦 点 产 物</div>
                <div class="workspace-content" id="workspace">等待生成...</div>
            </div>

        </div>
    </div>

    <div class="controls hidden" id="controlsPanel">
        <div class="mode-switch">
            <button id="godModeBtn" class="active" onclick="switchMode('god')">⚡ 上帝环境干预</button>
            <button id="playerModeBtn" onclick="switchMode('player')">👤 玩家化身入局</button>
        </div>
        <div class="intervention-box" id="godPanel">
            <input type="text" id="interventionInput" placeholder="在此输入高维指令（如：忽然一阵冷风吹开了窗户）...">
            <button onclick="sendIntervention()">降下神谕</button>
        </div>
        <div class="intervention-box hidden" id="playerPanel">
            <input type="text" id="playerAction" placeholder="你的动作 (如: 走上前作揖)" style="flex:0.3;">
            <input type="text" id="playerDialogue" placeholder="对他们说点什么..." style="flex:0.7;">
            <button onclick="sendPlayerAction()">发言</button>
        </div>
        <button class="advance-btn" id="nextBtn" onclick="nextRound()" style="margin-top:5px;">推进时空演化 (Advance)</button>
    </div>

    <script>
        let currentSessionId = "";
        let currentUserId = "anonymous";

        /* ══ Mood FSM ══════════════════════════════════════════ */
        const MOOD_META = {
            SERENE:    {cn:"平静",  motif:"清风徐来，水波不兴"},
            MELANCHOLY:{cn:"忧郁",  motif:"残烛明灭，暗影浮动"},
            TENSE:     {cn:"紧张",  motif:"乌云压顶，风雨欲来"},
            JOYFUL:    {cn:"欢愉",  motif:"春和景明，鸟语花香"},
            SOLEMN:    {cn:"庄严",  motif:"古松挺立，暮鼓晨钟"},
            CHAOTIC:   {cn:"动荡",  motif:"惊鸟四散，尘土飞扬"},
        };
        let currentMood = null;

        function applyMood(mood) {
            if (!mood || mood === currentMood) return;
            const prev = currentMood;
            currentMood = mood;
            if (prev !== null) {
                const flash = document.getElementById('mood-flash');
                flash.classList.add('active');
                setTimeout(() => flash.classList.remove('active'), 320);
            }
            document.body.setAttribute('data-mood', mood);
            const meta = MOOD_META[mood] || {cn: mood, motif:""};
            document.getElementById('mood-label').textContent = "世界情绪：" + meta.cn;
            document.getElementById('mood-motif').textContent = meta.motif ? "· " + meta.motif : "";
            document.getElementById('mood-bar').classList.add('visible');
        }

        /* ══ 叙事弧线面板 ══════════════════════════════════════ */
        const ARC_ORDER = ["OPENING","RISING","CLIMAX","DENOUEMENT"];
        const ARC_DESC = {
            OPENING:   "序幕已启，时空初醒",
            RISING:    "暗流涌动，矛盾渐深",
            CLIMAX:    "风云际会，命运交锋",
            DENOUEMENT:"尘埃落定，余韵绕梁",
        };
        let currentPhase = null;

        function updateArcPhase(phase) {
            if (!phase || phase === currentPhase) return;
            currentPhase = phase;
            const idx = ARC_ORDER.indexOf(phase);
            // 进度条百分比
            const pct = idx < 0 ? 0 : Math.round((idx / (ARC_ORDER.length - 1)) * 100);
            document.getElementById('arc-phases').style.setProperty('--arc-pct', pct + '%');
            ARC_ORDER.forEach((p, i) => {
                const dot = document.getElementById('arc-' + p);
                const lbl = document.getElementById('arc-lbl-' + p);
                dot.classList.remove('active','done');
                lbl.classList.remove('active');
                if (i < idx) { dot.classList.add('done'); }
                else if (i === idx) { dot.classList.add('active'); lbl.classList.add('active'); }
            });
            document.getElementById('arc-desc').textContent = ARC_DESC[phase] || phase;
        }

        /* ══ 人格一致性环 ══════════════════════════════════════ */
        const SCORE_LABELS = {100:"人格无缺",90:"契合极高",75:"基本一致",60:"略有偏差",40:"人格动摇",0:"身份混乱"};

        function updateConsistency(score) {
            if (score === undefined || score === null) return;
            const s = Math.max(0, Math.min(100, Number(score)));
            const circumference = 2 * Math.PI * 34; // r=34 → ~213.6
            const offset = circumference * (1 - s / 100);
            const fill = document.getElementById('ring-fill');
            fill.style.strokeDasharray = circumference;
            fill.style.strokeDashoffset = offset;
            document.getElementById('score-num').textContent = s;
            // 找最近的标签
            const keys = Object.keys(SCORE_LABELS).map(Number).sort((a,b)=>b-a);
            const key = keys.find(k => s >= k) ?? 0;
            document.getElementById('score-lbl').textContent = SCORE_LABELS[key];
            // 颜色提示
            const desc = document.getElementById('consistency-desc');
            if (s >= 80) desc.textContent = "角色人格与历史原型高度契合";
            else if (s >= 60) desc.textContent = "人格基本一致，偶有微小偏移";
            else if (s >= 40) desc.textContent = "人格出现明显偏差，需留意";
            else desc.textContent = "⚠ 角色人格严重动摇";
        }

        /* ══ 探索档案面板 ══════════════════════════════════════ */
        async function refreshProfile() {
            try {
                const res = await fetch('/api/profile/' + currentUserId);
                if (!res.ok) return;
                const p = await res.json();
                document.getElementById('profile-title').textContent = p.title || "初入时空";
                document.getElementById('p-sessions').textContent = p.total_sessions || 0;
                document.getElementById('p-rounds').textContent = p.total_rounds || 0;
                const erasEl = document.getElementById('p-eras');
                if (p.explored_eras && p.explored_eras.length > 0) {
                    erasEl.innerHTML = p.explored_eras.slice(-8).map(e =>
                        `<span class="era-tag">${e}</span>`).join('');
                } else {
                    erasEl.innerHTML = '<span style="color:#bbb;font-size:0.8em;">尚未探索</span>';
                }
                if (p.recommended_era) {
                    document.getElementById('p-hint').textContent = `✦ 推荐探索：${p.recommended_era}`;
                }
            } catch(e) {}
        }

        /* ══ 情境知识气泡 ══════════════════════════════════════ */
        let bubbleTimer = null;
        let bubbleVisible = false;
        const bubble = document.getElementById('knowledge-bubble');
        const KNOWN_TERMS = [
            "科举","进士","举人","翰林","内阁","六部","御史","宦官","太监",
            "尚书","侍郎","刺史","知府","知县","衙门","八股","朝贡","藩王",
            "锦衣卫","东厂","西厂","番邦","蛮夷","夷狄","华夷","礼制","宗法",
            "贬谪","流放","廷杖","勾栏","青楼","瓦肆","茶馆","盐引","漕运",
            "驿站","折冲府","节度使","都督","丞相","宰相","三省六部","察举制",
            "均田制","租庸调","两税法","一条鞭法","摊丁入亩","改土归流"
        ];
        const explainCache = {};

        function markTerms(el) {
            // 对 agent-dialogue 内文本进行词条标注（不重复处理）
            if (el.dataset.marked) return;
            el.dataset.marked = "1";
            let html = el.innerHTML;
            KNOWN_TERMS.forEach(term => {
                if (html.includes(term) && !html.includes(`data-term="${term}"`)) {
                    html = html.replaceAll(term,
                        `<span class="knows-term" data-term="${term}">${term}</span>`);
                }
            });
            el.innerHTML = html;
        }

        document.addEventListener('mouseover', async (e) => {
            const target = e.target.closest('.knows-term');
            if (!target) return;
            const term = target.dataset.term;
            if (!term) return;
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(async () => {
                const termEl = document.getElementById('bubble-term');
                const bodyEl = document.getElementById('bubble-body');
                termEl.textContent = term;
                bodyEl.innerHTML = '<span class="bubble-loader">查阅典籍中...</span>';
                positionBubble(e);
                bubble.classList.add('visible');
                bubbleVisible = true;
                if (explainCache[term]) {
                    bodyEl.textContent = explainCache[term];
                } else {
                    try {
                        const res = await fetch('/api/explain', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({term, context: getCurrentSceneContext()})
                        });
                        const d = await res.json();
                        explainCache[term] = d.explanation;
                        if (bubbleVisible) bodyEl.textContent = d.explanation;
                    } catch(err) {
                        bodyEl.textContent = "（典籍未载）";
                    }
                }
            }, 400);
        });

        document.addEventListener('mousemove', (e) => {
            if (bubbleVisible) positionBubble(e);
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.knows-term')) {
                clearTimeout(bubbleTimer);
                bubble.classList.remove('visible');
                bubbleVisible = false;
            }
        });

        function positionBubble(e) {
            const bw = 270, bh = 120;
            let x = e.clientX + 14, y = e.clientY + 14;
            if (x + bw > window.innerWidth - 10) x = e.clientX - bw - 10;
            if (y + bh > window.innerHeight - 10) y = e.clientY - bh - 10;
            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';
        }

        function getCurrentSceneContext() {
            // 取最后一张 agent-dialogue 的文本作为场景上下文
            const dialogues = document.querySelectorAll('.agent-dialogue');
            if (dialogues.length > 0) {
                return dialogues[dialogues.length-1].textContent.slice(0, 150);
            }
            return '';
        }

        /* ══ 反思弹层 ══════════════════════════════════════════ */
        function showReflection(data) {
            document.getElementById('r-insight').textContent = data.insight || "";
            document.getElementById('r-question').textContent = "「" + (data.reflection_question || "") + "」";
            const factEl = document.getElementById('r-era-fact');
            if (data.era_fact && data.era_fact !== "无") {
                factEl.textContent = "📜 历史彩蛋：" + data.era_fact;
                factEl.style.display = "";
            } else {
                factEl.style.display = "none";
            }
            document.getElementById('reflection-overlay').classList.add('open');
        }

        function closeReflection() {
            document.getElementById('reflection-overlay').classList.remove('open');
        }

        document.getElementById('reflection-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeReflection();
        });

        /* ══ 世界创建 & 恢复 ══════════════════════════════════ */
        async function createNewWorld() {
            const theme = document.getElementById('worldThemeInput').value.trim();
            const genre = document.getElementById('worldGenreInput').value;
            const btn = document.getElementById('createWorldBtn');
            const statusDiv = document.getElementById('creationStatus');
            if (!theme) { alert("请输入要创世的主题！"); return; }
            btn.disabled = true;
            statusDiv.innerText = "🌌 正在连接高维大模型进行世界推演，请耐心等待（约 10-20 秒）...";
            try {
                const res = await fetch('/api/create_world', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({theme, genre})
                });
                const data = await res.json();
                if (data.status === "success") {
                    currentSessionId = data.session_id;
                    if (data.world_mood) applyMood(data.world_mood);
                    enterWorldMode();
                    initWorldUI(data);
                    refreshProfile();
                } else {
                    statusDiv.innerText = "❌ 创世失败：" + data.message;
                    btn.disabled = false;
                }
            } catch(e) {
                statusDiv.innerText = "❌ 网络错误，无法连接到后端世界架构师。";
                btn.disabled = false;
            }
        }

        function resumeWorld() {
            const sid = document.getElementById('resumeSessionId').value.trim();
            if (!sid) { alert("请输入要唤醒的 Session ID！"); return; }
            currentSessionId = sid;
            enterWorldMode();
            const stream = document.getElementById('chat-stream');
            stream.innerHTML = '';
            appendNarrator(`时空坐标锁定完毕。正在从硬盘深处唤醒 [${sid}] 的世界进度与物理法则...`);
            fetchWorldState();
            nextRound();
            refreshProfile();
        }

        async function fetchWorldState() {
            if (!currentSessionId) return;
            try {
                const res = await fetch('/api/world_state/' + currentSessionId);
                if (res.ok) {
                    const d = await res.json();
                    if (d.mood) applyMood(d.mood);
                }
            } catch(e) {}
        }

        function enterWorldMode() {
            document.getElementById('creationPanel').classList.add('hidden');
            document.getElementById('mainContainer').classList.remove('hidden');
            document.getElementById('controlsPanel').classList.remove('hidden');
        }

        function initWorldUI(data) {
            const stream = document.getElementById('chat-stream');
            stream.innerHTML = '';
            const bgCardHtml = `
                <div class="chat-card">
                    <div class="agent-name">【时空背景】 (坐标: <span style="user-select:all;background:#eee;padding:2px 5px;border-radius:3px;">${data.session_id}</span>)</div>
                    <div class="agent-dialogue" style="white-space:pre-wrap;">${data.scene_desc}</div>
                    <div style="margin-top:15px;font-size:0.9em;color:#666;font-style:italic;">
                        唤醒角色：${data.agents.join("、")}，以及异乡人（你）。
                    </div>
                </div>`;
            stream.insertAdjacentHTML('beforeend', bgCardHtml);
            if (data.initial_dialogue) {
                stream.insertAdjacentHTML('beforeend', `
                    <div class="chat-card">
                        <div class="agent-name">【起始动作】</div>
                        <div class="agent-dialogue">${data.initial_dialogue}</div>
                    </div>`);
            }
        }

        function switchMode(mode) {
            document.getElementById('godModeBtn').classList.toggle('active', mode==='god');
            document.getElementById('playerModeBtn').classList.toggle('active', mode==='player');
            document.getElementById('godPanel').classList.toggle('hidden', mode!=='god');
            document.getElementById('playerPanel').classList.toggle('hidden', mode!=='player');
        }

        async function sendIntervention() {
            if (!currentSessionId) return;
            const input = document.getElementById('interventionInput');
            const msg = input.value.trim();
            if (!msg) return;
            try {
                await fetch('/api/intervene', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({message: msg, session_id: currentSessionId})
                });
                input.value = '';
                input.placeholder = "⚡ 神谕已下达，将在下一幕触发...";
                setTimeout(() => input.placeholder = "在此输入高维指令...", 3000);
            } catch(e) {}
        }

        async function sendPlayerAction() {
            if (!currentSessionId) return;
            const action = document.getElementById('playerAction').value.trim() || "看着大家";
            const dialogue = document.getElementById('playerDialogue').value.trim();
            if (!dialogue) return;
            try {
                await fetch('/api/player_act', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({session_id: currentSessionId, action, dialogue})
                });
                appendChatCard("异乡人（你）", action, dialogue, "无", "无", true);
                document.getElementById('playerAction').value = '';
                document.getElementById('playerDialogue').value = '';
                nextRound();
            } catch(e) {}
        }

        /* ══ SSE 全事件接入 ══════════════════════════════════ */
        function nextRound() {
            if (!currentSessionId) return;
            const btn = document.getElementById('nextBtn');
            btn.disabled = true;
            btn.innerText = "时空法则正在演算...";
            removeThinking();

            const url = `/api/stream_next/${currentSessionId}?user_id=${currentUserId}`;
            const eventSource = new EventSource(url);

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'narrator') {
                    appendNarrator(data.content);
                } else if (data.type === 'thinking') {
                    appendThinking(data.name);
                } else if (data.type === 'stream_token') {
                    removeThinking();
                    appendOrUpdateStreamCard(data.name, data.content);
                } else if (data.type === 'agent_action') {
                    removeStreamCard();
                    appendChatCard(data.name, data.action, data.dialogue, data.contribution, data.show_image);
                    updateWorkspace(data.workspace);
                    if (data.world_mood) applyMood(data.world_mood);
                    if (data.narrative_phase) updateArcPhase(data.narrative_phase);
                    if (data.consistency_score !== undefined) updateConsistency(data.consistency_score);
                    eventSource.close();
                    resetButton();
                } else if (data.type === 'historical_echo') {
                    appendEchoCard(data.content);
                } else if (data.type === 'choices_ready') {
                    loadAndRenderChoices();
                } else if (data.type === 'reflection') {
                    showReflection(data);
                } else if (data.type === 'world_mood_change') {
                    applyMood(data.new_mood);
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
                removeThinking();
                removeStreamCard();
                resetButton();
                appendNarrator("【系统】时空波动异常，演算暂时中断。");
            };

            function resetButton() {
                btn.disabled = false;
                btn.innerText = "推进时空演化 (Advance)";
                scrollToBottom();
                refreshProfile();
            }
        }

        /* ══ DOM helpers ════════════════════════════════════ */
        function appendEchoCard(content) {
            const stream = document.getElementById('chat-stream');
            stream.insertAdjacentHTML('beforeend', `
                <div class="chat-card echo-card">
                    <div class="echo-label">✦ 历 史 回 响 ✦</div>
                    <div class="echo-text">${content}</div>
                </div>`);
            scrollToBottom();
        }

        async function loadAndRenderChoices() {
            if (!currentSessionId) return;
            try {
                const res = await fetch('/api/choices/' + currentSessionId);
                if (!res.ok) return;
                const data = await res.json();
                if (!data.choices || !data.choices.length) return;
                // 同步叙事阶段
                if (data.phase) updateArcPhase(data.phase);
                renderChoicesCard(data.choices);
            } catch(e) {}
        }

        function renderChoicesCard(choices) {
            const stream = document.getElementById('chat-stream');
            const cardId = 'choices-' + Date.now();
            const btns = choices.map(c => `
                <button class="choice-btn" data-id="${c.id}" data-group="${cardId}"
                    onclick="selectChoice('${c.id}','${cardId}',this)">
                    ${c.text || c.label || c.id}
                </button>`).join('');
            stream.insertAdjacentHTML('beforeend', `
                <div class="chat-card choices-card" id="${cardId}">
                    <div class="choices-title">⬦ 命 运 分 叉 · 请 做 出 选 择</div>
                    ${btns}
                </div>`);
            scrollToBottom();
        }

        async function selectChoice(choiceId, cardId, btn) {
            const card = document.getElementById(cardId);
            if (!card) return;
            card.querySelectorAll('.choice-btn').forEach(b => {
                b.disabled = true;
                if (b === btn) b.classList.add('selected');
            });
            try {
                await fetch('/api/choose', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({session_id: currentSessionId, choice_id: choiceId})
                });
                nextRound();
            } catch(e) {}
        }

        function appendOrUpdateStreamCard(name, token) {
            let card = document.getElementById('streaming-card');
            if (!card) {
                document.getElementById('chat-stream').insertAdjacentHTML('beforeend', `
                    <div class="chat-card" id="streaming-card">
                        <div class="agent-name">【${name}】<span style="font-size:0.7em;color:#7F8C8D;font-weight:normal;margin-left:10px;">(神识推演中...)</span></div>
                        <div class="agent-dialogue" style="font-family:monospace;white-space:pre-wrap;font-size:0.95em;color:#555;" id="streaming-content"></div>
                    </div>`);
            }
            const oldCursor = document.getElementById('typing-cursor');
            if (oldCursor) oldCursor.remove();
            const contentDiv = document.getElementById('streaming-content');
            contentDiv.appendChild(document.createTextNode(token));
            contentDiv.insertAdjacentHTML('beforeend', '<span class="typing-cursor" id="typing-cursor"></span>');
            scrollToBottom();
        }

        function removeStreamCard() {
            const c = document.getElementById('streaming-card');
            if (c) c.remove();
        }

        function appendChatCard(name, action, dialogue, contribution, showImage, isPlayer=false) {
            const contributionHtml = contribution && contribution!=="无"
                ? `<div class="agent-contribution">[产物变化]：${contribution}</div>` : '';
            let imageHtml = '';
            if (showImage && showImage!=="无") {
                imageHtml = `<div style="margin-top:15px;margin-left:10px;"><img src="/images/${showImage}" style="max-width:80%;border:2px solid var(--border-gold);border-radius:4px;" onerror="this.src='/images/song/${showImage}'"></div>`;
            }
            const borderStyle = isPlayer ? 'border-color:#2C3E50;border-width:2px;' : '';
            const nameColor  = isPlayer ? 'color:#2C3E50;' : '';
            const bgStyle    = isPlayer ? 'background:#F4F7F6;' : '';

            const stream = document.getElementById('chat-stream');
            stream.insertAdjacentHTML('beforeend', `
                <div class="chat-card" style="${borderStyle}${bgStyle}">
                    <div class="agent-name" style="${nameColor}">【${name}】</div>
                    <div class="agent-action">动作：${action}</div>
                    <div class="agent-dialogue" data-raw="1">${dialogue}</div>
                    ${imageHtml}${contributionHtml}
                </div>`);

            // 对新加入的对话卡做词条标注
            const newDialogues = stream.querySelectorAll('.agent-dialogue[data-raw="1"]');
            newDialogues.forEach(el => {
                el.removeAttribute('data-raw');
                markTerms(el);
            });

            scrollToBottom();
        }

        function appendNarrator(content) {
            document.getElementById('chat-stream').insertAdjacentHTML('beforeend',
                `<div class="chat-card narrator-card"><span>🎬 ${content}</span></div>`);
            scrollToBottom();
        }

        function appendThinking(name) {
            removeThinking();
            document.getElementById('chat-stream').insertAdjacentHTML('beforeend',
                `<div id="thinking-indicator" class="thinking-indicator">【${name}】的意识正在涌动...</div>`);
            scrollToBottom();
        }

        function removeThinking() {
            const el = document.getElementById('thinking-indicator');
            if (el) el.remove();
        }

        function updateWorkspace(content) {
            document.getElementById('workspace').innerHTML = content.replace(/\n/g,'<br>');
        }

        function scrollToBottom() {
            window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
        }
    </script>
</body>
</html>
